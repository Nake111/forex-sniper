generate-api-key.yml

name: Generate Forex Sniper API Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate secure 32-character API key
        id: generate
        shell: bash
        run: |
          python3 - <<'PY'
          import secrets
          import string
          import os

          alphabet = string.ascii_letters + string.digits
          key = ''.join(secrets.choice(alphabet) for _ in range(32))

          print(f"::add-mask::{key}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"api_key={key}\n")
          PY

      - name: Save API key as GitHub Secret
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          API_KEY: ${{ steps.generate.outputs.api_key }}
        run: |
          gh secret set FOREX_API_KEY \
            --body "$API_KEY" \
            --repo "$GITHUB_REPOSITORY"

      - name: Confirm completion
        run: echo "API key generated and saved securely."
