name: Forex Sniper Analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
      - "*.test.js"
      - ".github/workflows/forex-sniper.yml"

concurrency:
  group: forex-sniper-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Check syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Download EUR/USD, BTC/USD and XAU/USD candles
        run: npm run download
        env:
          DATA_DAYS_BACK: "180"
      - name: Generate signal report
        run: |
          set -o pipefail
          npm start 2>&1 | tee signals.txt
      - name: Upload signal report immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forex-sniper-signals
          path: signals.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Run full-history profile comparisons
        run: |
          set -o pipefail
          npm run backtest:all | tee backtests.txt
          npm run backtest:experiments | tee -a backtests.txt
          npm run backtest:advanced | tee -a backtests.txt
          npm run backtest:institutional | tee -a backtests.txt
      - name: Run chronological 30% holdout validation
        run: |
          set -o pipefail
          npm run backtest:holdout | tee -a backtests.txt
          npm run backtest:holdout:advanced | tee -a backtests.txt
          npm run backtest:holdout:institutional | tee -a backtests.txt
      - name: Upload backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forex-sniper-backtests
          path: backtests.txt
          if-no-files-found: warn
          retention-days: 14
