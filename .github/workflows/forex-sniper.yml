name: Forex Sniper Analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
      - "*.test.js"
      - ".github/workflows/forex-sniper.yml"

concurrency:
  group: forex-sniper-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BTC_DATA_PREFIX: btcusdt
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Check syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Download recent candles for prompt signal analysis
        run: npm run download
        env:
          DATA_DAYS_BACK: "30"
          DOWNLOAD_CONCURRENCY: "3"
          DUKASCOPY_BATCH_SIZE: "10"
          DUKASCOPY_BATCH_PAUSE_MS: "100"
          DUKASCOPY_REQUEST_INTERVAL_MS: "100"
          DUKASCOPY_RETRY_COUNT: "2"
          DUKASCOPY_RATE_LIMIT_RETRIES: "3"

      - name: Generate signal report
        run: |
          set -o pipefail
          npm start 2>&1 | tee signals.txt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          LLM_TIMEOUT_MS: "8000"
      - name: Upload signal report immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forex-sniper-signals
          path: signals.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Download 180-day history for strategy validation
        run: npm run download
        env:
          DATA_DAYS_BACK: "180"
          DOWNLOAD_CONCURRENCY: "3"
          DUKASCOPY_BATCH_SIZE: "10"
          DUKASCOPY_BATCH_PAUSE_MS: "100"
          DUKASCOPY_REQUEST_INTERVAL_MS: "100"
          DUKASCOPY_RETRY_COUNT: "2"
          DUKASCOPY_RATE_LIMIT_RETRIES: "3"
      - name: Compare baseline, advanced and institutional strategies on a 30% chronological holdout
        run: |
          set -o pipefail
          {
            echo '=== BASELINE ==='
            npm run backtest:holdout
            echo '=== ADVANCED ==='
            npm run backtest:holdout:advanced
            echo '=== INSTITUTIONAL ==='
            npm run backtest:holdout:institutional
            echo '=== GOLD-SPECIFIC ==='
            BACKTEST_START_RATIO=0.7 MARKET=XAUUSD SIGNAL_PROFILE=gold node src/backtest.js
          } 2>&1 | tee backtests.txt
      - name: Upload backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forex-sniper-backtests
          path: backtests.txt
          if-no-files-found: warn
          retention-days: 14
