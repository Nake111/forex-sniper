name: Legacy Forex Sniper Analysis (disabled)

# The canonical end-to-end pipeline is Forex Sniper Live Candle Refresh.
# This legacy workflow previously published signals.json without updating
# latest.json, causing analysis-cycle mismatches and watchdog rejections.
# Keep manual dispatch as a harmless diagnostic only; do not schedule or
# publish from this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain canonical pipeline
        run: |
          echo "This legacy publisher is intentionally disabled."
          echo "Use .github/workflows/live-candle-refresh.yml for synchronized M5/Higher-TF candles, quotes, signals and dashboard publication."
          echo "No market data or signal files are changed by this workflow."
