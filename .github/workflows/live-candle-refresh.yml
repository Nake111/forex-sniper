name: Forex Sniper Live Candle Refresh

run-name: Forex Sniper Signal Request — ${{ inputs.request_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Optional ChatGPT/Railway request correlation ID"
        required: false
        type: string
        default: manual
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-candle-refresh.yml"
      - "src/publish-dashboard-data.js"
      - "scripts/publish-signal-controller.js"
      - "scripts/stale-data-watchdog.js"
      - "src/signal-format.js"
      - "src/decision-layers.js"
      - "src/entry-verification-agent.js"
      - "src/entry-verification-agent.test.js"
      - "src/second-brain.js"
      - "src/download.js"
      - "src/fdn-data.js"
      - "tests/fdn-data.test.js"
      - "src/index.js"
      - "src/market-intelligence-agent.js"
      - "src/signal-approval-agent.js"
      - "tests/agents.test.js"
      - "tests/weighted-score.test.js"
      - "src/twelve-data-quotes.js"
      - "src/bid-ask-quotes.js"
      - "src/realtime-feed.js"
      - "src/biquote-quotes.js"
      - "tests/bid-ask-quotes.test.js"
      - "tests/twelve-data-quotes.test.js"
      - "src/btc-live-microstructure.js"
      - "src/binance-btc-order-flow.js"
      - "src/binance-btc-order-flow.test.js"
      - "src/coinbase-kraken-btc-order-flow.js"
      - "src/coinbase-kraken-btc-order-flow.test.js"
      - "src/btc-signal-quality.js"
      - "src/btc-signal-quality.test.js"
      - "src/signal.js"
      - "signal.test.js"
      - "src/live-market-sync.js"
      - "src/live-market-sync.test.js"
      - "scripts/verify-live-market-sync.js"
      - "src/second-brain.js"
      - "src/paper-performance.js"
      - "scripts/publish-paper-performance.js"
      - "tests/paper-performance.test.js"
      - "second-brain.test.js"
      - "src/economic-calendar.js"
      - "src/macro.js"
      - "src/trading-agents.js"
      - "tests/economic-calendar.test.js"
      - "src/tiered-signal.js"
      - "src/trade-plan.js"
      - "src/llm-agents.js"
      - "tests/llm-agents.test.js"
      - "trade-plan.test.js"
      - "market.test.js"
      - "dashboard/market-data.js"
      - "dashboard/performance.html"
      - "package.json"
  # GitHub Actions schedule: five-minute target cadence. The separate stale-data watchdog blocks old publications if Actions delays a run.
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: forex-sniper-market-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-and-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATA_DAYS_BACK: "30"
      DATA_OVERLAP_DAYS: "1"
      DOWNLOAD_CONCURRENCY: "6"
      BTC_DATA_PREFIX: "kraken-btcusd"
      LLM_TIMEOUT_MS: "5000"
      GEMINI_MODEL: "gemini-3.5-flash-lite"
      BTC_ORDER_FLOW_FEED_URL: "https://coinbase-kraken-btc-order-flow-production.up.railway.app/order-flow"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore candle history cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            .cache
          key: forex-sniper-candles-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            forex-sniper-candles-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Mandatory code and regression checks
        run: |
          npm run check
          npm test
      - name: Refresh EUR/USD, BTC/USD and XAU/USD candles
        run: npm run download
        env:
          DATA_DAYS_BACK: "30"
          DATA_OVERLAP_DAYS: "1"
          DOWNLOAD_CONCURRENCY: "6"
          BTC_DATA_PREFIX: "kraken-btcusd"
          BTC_ORDER_FLOW_FEED_URL: ${{ env.BTC_ORDER_FLOW_FEED_URL }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FDN_API_KEY: ${{ secrets.FDN_API_KEY }}
          FDN_MAX_PAGES: "1"
          DUKASCOPY_BATCH_SIZE: "8"
          DUKASCOPY_BATCH_PAUSE_MS: "150"
          DUKASCOPY_REQUEST_INTERVAL_MS: "120"
          DUKASCOPY_RETRY_COUNT: "3"
          DUKASCOPY_RATE_LIMIT_RETRIES: "4"
      - name: Verify approved chronological training cutoff
        env:
          AGENT_TRAINING_CUTOFF: ${{ vars.AGENT_TRAINING_CUTOFF || '2026-09-21T07:25:00.000Z' }}
        run: |
          node --input-type=module <<'NODE'
          const expected = '2026-09-21T07:25:00.000Z';
          const actual = new Date(process.env.AGENT_TRAINING_CUTOFF ?? '').toISOString();
          if (actual !== expected) throw new Error('AGENT_TRAINING_CUTOFF is missing or differs from the approved frozen boundary.');
          console.log('Approved cutoff verified:', actual);
          console.log('Holdout protection: final 30% remains locked; no holdout optimization or outcome reads.');
          NODE
      - name: Preflight Coinbase spot + Kraken Futures BTC order-flow (BTC-only fail-closed)
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          const endpoint = process.env.BTC_ORDER_FLOW_FEED_URL;
          if (!endpoint) throw new Error('BTC_ORDER_FLOW_FEED_URL is not configured');
          const deadline = Date.now() + 90_000;
          let lastError = 'feed has not returned a ready snapshot';
          while (Date.now() < deadline) {
            try {
              const healthUrl = endpoint.replace(/\/order-flow$/, '/health');
              const healthResponse = await fetch(healthUrl, { signal: AbortSignal.timeout(5000), headers: { accept: 'application/json' } });
              const health = await healthResponse.json();
              if (!healthResponse.ok || health.status !== 'READY') throw new Error('adapter health=' + JSON.stringify(health));
              const response = await fetch(endpoint, { signal: AbortSignal.timeout(5000), headers: { accept: 'application/json' } });
              if (!response.ok) throw new Error('order-flow HTTP ' + response.status);
              const data = await response.json();
              const ageMs = Date.now() - Number(data.timestamp);
              const finite = value => Number.isFinite(Number(value));
              const valid = data.symbol === 'BTC-USD' && typeof data.source === 'string' && data.source.length > 0 &&
                finite(data.timestamp) && ageMs >= -2000 && ageMs <= 30_000 &&
                ['spot', 'perpetual'].every(key => data[key] && ['buyVolume', 'sellVolume', 'cvd'].every(field => finite(data[key][field]))) &&
                finite(data.perpetual.openInterestChangePct) && finite(data.perpetual.fundingRate);
              if (!valid) throw new Error('order-flow snapshot is incomplete, stale or invalid');
              console.log(JSON.stringify({ status: 'READY', source: data.source, symbol: data.symbol, ageMs,
                spotCvd: data.spot.cvd, perpetualCvd: data.perpetual.cvd,
                openInterestChangePct: data.perpetual.openInterestChangePct, fundingRate: data.perpetual.fundingRate }));
              process.exit(0);
            } catch (error) {
              lastError = error.message;
              console.log('Waiting for fresh Coinbase/Kraken order-flow: ' + lastError);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          throw new Error('Coinbase/Kraken BTC order-flow did not become ready within 90 seconds: ' + lastError);
          NODE
      - name: Generate timestamped three-market signal report
        id: signal_report
        run: |
          mkdir -p reports
          set -o pipefail
          REPORT_PATH="reports/live-signals-$(date -u +%Y%m%dT%H%M%SZ).txt"
          echo "REPORT_PATH=$REPORT_PATH" >> "$GITHUB_ENV"
          CYCLE_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          CYCLE_SLOVENIA="$(TZ=Europe/Ljubljana date -Iseconds)"
          {
            echo "FOREX SNIPER AUTOMATIC SIGNAL REPORT"
            echo "Analysis cycle UTC: $CYCLE_UTC"
            echo "Analysis cycle Slovenia: $CYCLE_SLOVENIA"
            echo "Analysis timezone: Europe/Ljubljana"
            echo "Generated UTC: $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo "Generated Slovenia: $(TZ=Europe/Ljubljana date -Iseconds)"
            echo "Target cadence: 5 minutes; GitHub scheduling can be delayed."
            npm start
          } 2>&1 | tee "$REPORT_PATH"
        env:
          AGENT_TRAINING_CUTOFF: ${{ vars.AGENT_TRAINING_CUTOFF || '2026-09-21T07:25:00.000Z' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          GEMINI_MODEL: ${{ env.GEMINI_MODEL }}
          BTC_DATA_PREFIX: "kraken-btcusd"
      - name: Require fresh quotes, five-agent execution and independent verification
        run: node scripts/verify-snapshot.js "$REPORT_PATH"
        env:
          MAX_SNAPSHOT_QUOTE_AGE_MS: "15000"
      - name: Build fail-closed live signal controller snapshot
        run: node scripts/publish-signal-controller.js "$REPORT_PATH"
        env:
          MAX_SIGNAL_REPORT_AGE_MS: "600000"

      - name: Refresh provider bid/ask immediately before publication
        continue-on-error: true
        run: node scripts/refresh-publication-quotes.js

      - name: Verify synchronized live quotes and closed M5 candles
        continue-on-error: true
        run: node scripts/verify-live-market-sync.js
        env:
          MAX_SYNC_QUOTE_AGE_MS: "15000"
          MAX_SYNC_QUOTE_SKEW_MS: "15000"
          MAX_SYNC_M5_AGE_MS: "600000"
      - name: Build strategy performance report from append-only paper journal
        run: node scripts/publish-paper-performance.js
      - name: Validate and publish closed dashboard candles
        shell: bash
        run: |
          set -euo pipefail
          CYCLE_UTC="$(sed -n 's/^Analysis cycle UTC: //p' "$REPORT_PATH" | head -n 1)"
          CYCLE_SLOVENIA="$(sed -n 's/^Analysis cycle Slovenia: //p' "$REPORT_PATH" | head -n 1)"
          test -n "$CYCLE_UTC" && test -n "$CYCLE_SLOVENIA"
          ANALYSIS_CYCLE_UTC="$CYCLE_UTC" ANALYSIS_CYCLE_SLOVENIA="$CYCLE_SLOVENIA" npm run publish:data
          watchdog_blocked=false
          if node scripts/stale-data-watchdog.js; then
            echo "Publication watchdog PASS: synchronized candles and provider quotes are fresh."
          else
            echo "Publication watchdog BLOCKED: publishing fail-closed NO APPROVED TRADE states." >&2
            watchdog_blocked=true
          fi
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const [s, q] = await Promise.all([
              readFile("dashboard/data/latest.json", "utf8").then(JSON.parse),
              readFile("dashboard/data/signals.json", "utf8").then(JSON.parse)
            ]);
            const expected = ["EURUSD", "BTCUSD", "XAUUSD"];
            const id = q.analysisCycle?.id;
            if (!id || s.analysisCycle?.id !== id) throw new Error("Dashboard and signal analysis cycles differ");
            if (q.analysisCycle?.timeZone !== "Europe/Ljubljana" || s.analysisCycle?.timeZone !== "Europe/Ljubljana") throw new Error("Incorrect analysis timezone");
            for (const market of expected) {
              if (!q.markets?.[market] || q.markets[market].analysisCycle?.id !== id) throw new Error(market + " missing or mismatched signal cycle");
            }
            if (Object.keys(q.markets).length !== expected.length) throw new Error("Signal publication has unexpected or missing markets");
            if (s.validation?.status !== "PASS") throw new Error("Dashboard candle snapshot is not PASS: " + s.validation?.status);
            console.log("SYNC VERIFIED:", id, "| Europe/Ljubljana | EURUSD + BTCUSD + XAUUSD");
          '
          snapshot="$(mktemp)"
          brain_snapshot="$(mktemp)"
          signal_snapshot="$(mktemp)"
          performance_snapshot="$(mktemp)"
          cp dashboard/data/latest.json "$snapshot"
          cp dashboard/data/signals.json "$signal_snapshot"
          cp dashboard/data/paper-performance.json "$performance_snapshot"
          if [ -f data/second-brain.jsonl ]; then cp data/second-brain.jsonl "$brain_snapshot"; else : > "$brain_snapshot"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=false
          for attempt in 1 2 3 4 5; do
            echo "Dashboard publish attempt $attempt/5"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            cp "$snapshot" dashboard/data/latest.json
            cp "$signal_snapshot" dashboard/data/signals.json
            cp "$performance_snapshot" dashboard/data/paper-performance.json
            mkdir -p data
            cp "$brain_snapshot" data/second-brain.jsonl
            git add dashboard/data/latest.json dashboard/data/signals.json dashboard/data/paper-performance.json data/second-brain.jsonl
            if git diff --cached --quiet; then
              echo "Dashboard candle snapshot is already current."
              pushed=true
              break
            fi
            git commit -m "Publish verified multi-market snapshot"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              pushed=true
              echo "Verified dashboard snapshot and Second Brain journal published."
              break
            fi
            echo "Branch advanced during publish; retrying on latest branch."
          done
          rm -f "$snapshot" "$signal_snapshot" "$performance_snapshot" "$brain_snapshot"
          if [ "$pushed" != true ]; then
            echo "Could not publish dashboard snapshot after five attempts." >&2
            exit 1
          fi
          if [ "$watchdog_blocked" = true ]; then
            echo "Snapshot was safely published as blocked; watchdog did not pass." >&2
            exit 1
          fi
        env:
          BTC_DATA_PREFIX: "kraken-btcusd"
      - name: Save candle history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            .cache
          key: forex-sniper-candles-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload signal report and candle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forex-sniper-live-${{ github.run_number }}
          path: |
            data/*.json
            reports/*.txt
          if-no-files-found: warn
          retention-days: 14
