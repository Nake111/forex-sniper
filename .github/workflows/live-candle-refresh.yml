name: Forex Sniper Live Candle Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-candle-refresh.yml"
      - "src/publish-dashboard-data.js"
      - "src/download.js"
      - "src/index.js"
      - "src/economic-calendar.js"
      - "src/macro.js"
      - "src/trading-agents.js"
      - "tests/economic-calendar.test.js"
      - "src/tiered-signal.js"
      - "src/trade-plan.js"
      - "src/llm-agents.js"
      - "tests/llm-agents.test.js"
      - "trade-plan.test.js"
      - "market.test.js"
      - "dashboard/market-data.js"
      - "package.json"
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: forex-sniper-live-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-and-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_DAYS_BACK: "30"
      DATA_OVERLAP_DAYS: "1"
      DOWNLOAD_CONCURRENCY: "4"
      BTC_DATA_PREFIX: "kraken-btcusd"
      LLM_TIMEOUT_MS: "5000"
      GEMINI_MODEL: "gemini-3.5-flash-lite"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore candle history cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            .cache
          key: forex-sniper-candles-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            forex-sniper-candles-

      - name: Install dependencies
        run: npm install

      - name: Validate code (diagnostic; do not block market analysis)
        id: validation
        continue-on-error: true
        run: |
          npm run check
          npm test

      - name: Report validation status
        if: steps.validation.outcome == 'failure'
        run: |
          echo "::warning::Code validation or tests failed. Continuing candle refresh and analysis for diagnostics; trade safety gates in the signal engine remain mandatory."
          echo "Validation failed; candle refresh and analysis will still run. Any BUY/SELL remains subject to data freshness, calendar, multi-agent, confirmation and risk gates." >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh latest candles (incremental + overlap + deduplication)
        run: npm run download
        env:
          DATA_DAYS_BACK: "30"
          DATA_OVERLAP_DAYS: "1"
          DOWNLOAD_CONCURRENCY: "4"
          BTC_DATA_PREFIX: "kraken-btcusd"
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          DUKASCOPY_BATCH_SIZE: "8"
          DUKASCOPY_BATCH_PAUSE_MS: "150"
          DUKASCOPY_REQUEST_INTERVAL_MS: "120"
          DUKASCOPY_RETRY_COUNT: "3"
          DUKASCOPY_RATE_LIMIT_RETRIES: "4"

      - name: Generate timestamped multi-market signal report
        run: |
          mkdir -p reports
          set -o pipefail
          npm start 2>&1 | tee "reports/live-signals-$(date -u +%Y%m%dT%H%M%SZ).txt"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINANCE_CALENDAR_API_KEY: ${{ secrets.FINANCE_CALENDAR_API_KEY }}
          GEMINI_MODEL: ${{ env.GEMINI_MODEL }}
          BTC_DATA_PREFIX: "kraken-btcusd"

      - name: Validate and publish closed candles for the dashboard
        shell: bash
        run: |
          set -euo pipefail
          npm run publish:data
          snapshot="$(mktemp)"
          cp dashboard/data/latest.json "$snapshot"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebuild the dashboard commit on top of the newest main branch.
          # This avoids JSON merge conflicts when another workflow publishes
          # the same snapshot file at nearly the same time.
          pushed=false
          for attempt in 1 2 3 4 5; do
            echo "Dashboard publish attempt $attempt/5"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            cp "$snapshot" dashboard/data/latest.json
            git add dashboard/data/latest.json

            if git diff --cached --quiet; then
              echo "Dashboard candle snapshot is already current."
              pushed=true
              break
            fi

            git commit -m "Publish validated latest market candles"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              pushed=true
              echo "Dashboard candle snapshot published."
              break
            fi
            echo "Branch advanced during publish; retrying on the latest branch."
          done

          rm -f "$snapshot"
          if [ "$pushed" != true ]; then
            echo "Could not publish dashboard snapshot after five attempts." >&2
            exit 1
          fi
        env:
          BTC_DATA_PREFIX: "kraken-btcusd"

      - name: Save candle history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            .cache
          key: forex-sniper-candles-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload latest candles and signal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forex-sniper-live-${{ github.run_number }}
          path: |
            data/*.json
            reports/*.txt
          if-no-files-found: warn
          retention-days: 7
