name: Forex Sniper Live Candle Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-candle-refresh.yml"
      - "src/publish-dashboard-data.js"
      - "scripts/publish-signal-controller.js"
      - "src/signal-format.js"
      - "src/decision-layers.js"
      - "src/entry-verification-agent.js"
      - "src/entry-verification-agent.test.js"
      - "src/second-brain.js"
      - "src/download.js"
      - "src/index.js"
      - "src/market-intelligence-agent.js"
      - "src/signal-approval-agent.js"
      - "tests/agents.test.js"
      - "tests/weighted-score.test.js"
      - "src/twelve-data-quotes.js"
      - "src/bid-ask-quotes.js"
      - "src/realtime-feed.js"
      - "src/biquote-quotes.js"
      - "tests/bid-ask-quotes.test.js"
      - "tests/twelve-data-quotes.test.js"
      - "src/btc-live-microstructure.js"
      - "src/second-brain.js"
      - "src/paper-performance.js"
      - "scripts/publish-paper-performance.js"
      - "tests/paper-performance.test.js"
      - "second-brain.test.js"
      - "src/economic-calendar.js"
      - "src/macro.js"
      - "src/trading-agents.js"
      - "tests/economic-calendar.test.js"
      - "src/tiered-signal.js"
      - "src/trade-plan.js"
      - "src/llm-agents.js"
      - "tests/llm-agents.test.js"
      - "trade-plan.test.js"
      - "market.test.js"
      - "dashboard/market-data.js"
      - "dashboard/performance.html"
      - "package.json"
  # GitHub Actions schedule: five-minute target cadence. The separate stale-data watchdog blocks old publications if Actions delays a run.
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: forex-sniper-market-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-and-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATA_DAYS_BACK: "30"
      DATA_OVERLAP_DAYS: "1"
      DOWNLOAD_CONCURRENCY: "6"
      BTC_DATA_PREFIX: "kraken-btcusd"
      LLM_TIMEOUT_MS: "5000"
      GEMINI_MODEL: "gemini-3.5-flash-lite"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore candle history cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            .cache
          key: forex-sniper-candles-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            forex-sniper-candles-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Mandatory code and regression checks
        run: |
          npm run check
          npm test
      - name: Refresh EUR/USD, BTC/USD and XAU/USD candles
        run: npm run download
        env:
          DATA_DAYS_BACK: "30"
          DATA_OVERLAP_DAYS: "1"
          DOWNLOAD_CONCURRENCY: "6"
          BTC_DATA_PREFIX: "kraken-btcusd"
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          DUKASCOPY_BATCH_SIZE: "8"
          DUKASCOPY_BATCH_PAUSE_MS: "150"
          DUKASCOPY_REQUEST_INTERVAL_MS: "120"
          DUKASCOPY_RETRY_COUNT: "3"
          DUKASCOPY_RATE_LIMIT_RETRIES: "4"
      - name: Generate timestamped three-market signal report
        id: signal_report
        run: |
          mkdir -p reports
          set -o pipefail
          REPORT_PATH="reports/live-signals-$(date -u +%Y%m%dT%H%M%SZ).txt"
          echo "REPORT_PATH=$REPORT_PATH" >> "$GITHUB_ENV"
          CYCLE_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          CYCLE_SLOVENIA="$(TZ=Europe/Ljubljana date -Iseconds)"
          {
            echo "FOREX SNIPER AUTOMATIC SIGNAL REPORT"
            echo "Analysis cycle UTC: $CYCLE_UTC"
            echo "Analysis cycle Slovenia: $CYCLE_SLOVENIA"
            echo "Analysis timezone: Europe/Ljubljana"
            echo "Generated UTC: $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo "Generated Slovenia: $(TZ=Europe/Ljubljana date -Iseconds)"
            echo "Target cadence: 5 minutes; GitHub scheduling can be delayed."
            npm start
          } 2>&1 | tee "$REPORT_PATH"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          GEMINI_MODEL: ${{ env.GEMINI_MODEL }}
          BTC_DATA_PREFIX: "kraken-btcusd"
      - name: Require fresh quotes and complete three-agent verification
        run: node scripts/verify-snapshot.js "$REPORT_PATH"
        env:
          MAX_SNAPSHOT_QUOTE_AGE_MS: "15000"
      - name: Build fail-closed live signal controller snapshot
        run: node scripts/publish-signal-controller.js "$REPORT_PATH"
        env:
          MAX_SIGNAL_REPORT_AGE_MS: "600000"

      - name: Build strategy performance report from append-only paper journal
        run: node scripts/publish-paper-performance.js
      - name: Validate and publish closed dashboard candles
        shell: bash
        run: |
          set -euo pipefail
          CYCLE_UTC="$(sed -n 's/^Analysis cycle UTC: //p' "$REPORT_PATH" | head -n 1)"
          CYCLE_SLOVENIA="$(sed -n 's/^Analysis cycle Slovenia: //p' "$REPORT_PATH" | head -n 1)"
          test -n "$CYCLE_UTC" && test -n "$CYCLE_SLOVENIA"
          ANALYSIS_CYCLE_UTC="$CYCLE_UTC" ANALYSIS_CYCLE_SLOVENIA="$CYCLE_SLOVENIA" npm run publish:data
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const [s, q] = await Promise.all([
              readFile("dashboard/data/latest.json", "utf8").then(JSON.parse),
              readFile("dashboard/data/signals.json", "utf8").then(JSON.parse)
            ]);
            const expected = ["EURUSD", "BTCUSD", "XAUUSD"];
            const id = q.analysisCycle?.id;
            if (!id || s.analysisCycle?.id !== id) throw new Error("Dashboard and signal analysis cycles differ");
            if (q.analysisCycle?.timeZone !== "Europe/Ljubljana" || s.analysisCycle?.timeZone !== "Europe/Ljubljana") throw new Error("Incorrect analysis timezone");
            for (const market of expected) {
              if (!q.markets?.[market] || q.markets[market].analysisCycle?.id !== id) throw new Error(market + " missing or mismatched signal cycle");
            }
            if (Object.keys(q.markets).length !== expected.length) throw new Error("Signal publication has unexpected or missing markets");
            if (s.validation?.status !== "PASS") throw new Error("Dashboard candle snapshot is not PASS: " + s.validation?.status);
            console.log("SYNC VERIFIED:", id, "| Europe/Ljubljana | EURUSD + BTCUSD + XAUUSD");
          '
          snapshot="$(mktemp)"
          brain_snapshot="$(mktemp)"
          signal_snapshot="$(mktemp)"
          performance_snapshot="$(mktemp)"
          cp dashboard/data/latest.json "$snapshot"
          cp dashboard/data/signals.json "$signal_snapshot"
          cp dashboard/data/paper-performance.json "$performance_snapshot"
          if [ -f data/second-brain.jsonl ]; then cp data/second-brain.jsonl "$brain_snapshot"; else : > "$brain_snapshot"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=false
          for attempt in 1 2 3 4 5; do
            echo "Dashboard publish attempt $attempt/5"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            cp "$snapshot" dashboard/data/latest.json
            cp "$signal_snapshot" dashboard/data/signals.json
            cp "$performance_snapshot" dashboard/data/paper-performance.json
            mkdir -p data
            cp "$brain_snapshot" data/second-brain.jsonl
            git add dashboard/data/latest.json dashboard/data/signals.json dashboard/data/paper-performance.json data/second-brain.jsonl
            if git diff --cached --quiet; then
              echo "Dashboard candle snapshot is already current."
              pushed=true
              break
            fi
            git commit -m "Publish verified multi-market snapshot"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              pushed=true
              echo "Verified dashboard snapshot and Second Brain journal published."
              break
            fi
            echo "Branch advanced during publish; retrying on latest branch."
          done
          rm -f "$snapshot" "$signal_snapshot" "$performance_snapshot" "$brain_snapshot"
          if [ "$pushed" != true ]; then
            echo "Could not publish dashboard snapshot after five attempts." >&2
            exit 1
          fi
        env:
          BTC_DATA_PREFIX: "kraken-btcusd"
      - name: Save candle history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            .cache
          key: forex-sniper-candles-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload signal report and candle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forex-sniper-live-${{ github.run_number }}
          path: |
            data/*.json
            reports/*.txt
          if-no-files-found: warn
          retention-days: 14
