name: BTCUSD Data and Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Download BTC/USD historical data
        run: npm run download

      - name: Run BTC/USD analysis
        run: npm run analyze

      - name: Run BTC/USD backtest
        run: npm run backtest

      - name: Save BTC/USD historical data
        uses: actions/upload-artifact@v4
        with:
          name: btcusd-historical-data
          path: |
            data/btcusd-m5.json
            data/btcusd-m15.json
            data/btcusd-h1.json
          if-no-files-found: error
          retention-days: 90
