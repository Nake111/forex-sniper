name: Manual Full Market Data Refresh

on:
  workflow_dispatch:

jobs:
  analysis:
    runs-on: ubuntu-latest
    env:
      BTC_DATA_PREFIX: kraken-btcusd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Download all supported market data
        run: npm run download

      - name: Run multi-market signal analysis
        run: npm start

      - name: Save historical data
        uses: actions/upload-artifact@v4
        with:
          name: full-market-historical-data
          path: data/*.json
          retention-days: 90
