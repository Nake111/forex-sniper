name: Download EURUSD Data

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Download EURUSD candles
        run: npm run download

      - name: Save data
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-historical-data
          path: data/eurusd-m5.json
