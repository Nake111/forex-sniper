name: Forex Sniper Stale-Data Watchdog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stale-data-watchdog.yml"
      - "scripts/stale-data-watchdog.js"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: forex-sniper-market-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout latest published snapshot
        uses: actions/checkout@v4
      - name: Recheck and publish fail-closed decisions with race-safe retries
        shell: bash
        run: |
          set -euo pipefail
          blocked=false
          published=false
          for attempt in 1 2 3 4 5; do
            echo "Watchdog publish attempt $attempt/5"
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            if node scripts/stale-data-watchdog.js; then
              blocked=false
            else
              blocked=true
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dashboard/data/signals.json
            if git diff --cached --quiet; then
              echo "No signal file changes required."
              published=true
              break
            fi
            git commit -m "Watchdog freshness check and fail-closed signal status"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              published=true
              break
            fi
            echo "Branch advanced during watchdog publication; rechecking latest data."
          done
          if [ "$published" != true ]; then
            echo "Could not publish watchdog result after five attempts." >&2
            exit 1
          fi
          if [ "$blocked" = true ]; then
            echo "Watchdog blocked stale or inconsistent market data. Affected signals are NO APPROVED TRADE."
            exit 1
          fi
          echo "Watchdog PASS: latest provider data and shared snapshot are fresh."
