name: Actions Queue Watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-queue-watchdog
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Recover stalled checks and missed market refreshes
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const now = Date.now();
            const staleAfterMs = 8 * 60 * 1000;
            const refreshStaleAfterMs = 12 * 60 * 1000;
            const dispatchCooldownMs = 10 * 60 * 1000;
            const refreshPath = ".github/workflows/live-candle-refresh.yml";
            const targetNames = new Set([
              "Main Branch Code and Test Check",
              "Quant Swarm Validation",
              "Signal Engine Regression Tests",
              "Market Data Provider Tests"
            ]);

            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, per_page: 100
            });
            const runs = data.workflow_runs;

            // First clean up queued jobs that have no runner/job record.
            const staleChecks = runs.filter(run =>
              targetNames.has(run.name) &&
              run.status === "queued" &&
              now - Date.parse(run.created_at) >= staleAfterMs
            );
            for (const run of staleChecks) {
              const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
                owner, repo, run_id: run.id, per_page: 100
              });
              if (jobsData.jobs.length === 0) {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                core.warning(`Cancelled stale queued check ${run.id} (${run.name})`);
              }
            }

            // Recover the actual market pipeline when GitHub has missed or delayed
            // scheduled invocations. Never start a second refresh while one is active.
            const refreshRuns = runs
              .filter(run => run.path === refreshPath && run.head_branch === "main")
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            const active = refreshRuns.find(run =>
              ["queued", "in_progress"].includes(run.status)
            );

            let cancelledStaleRefreshId = null;
            if (active?.status === "queued" &&
                now - Date.parse(active.created_at) >= staleAfterMs) {
              const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
                owner, repo, run_id: active.id, per_page: 100
              });
              if (jobsData.jobs.length === 0) {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: active.id });
                cancelledStaleRefreshId = active.id;
                core.warning(`Cancelled stalled queued market refresh ${active.id}`);
              }
            }

            const stillActive = refreshRuns.find(run =>
              ["queued", "in_progress"].includes(run.status) &&
              run.id !== cancelledStaleRefreshId
            );
            if (stillActive) {
              core.info(`Market refresh ${stillActive.id} is already ${stillActive.status}; no duplicate dispatch.`);
              return;
            }

            const latest = refreshRuns[0];
            const latestIsHealthy = latest?.status === "completed" &&
              latest.conclusion === "success" &&
              now - Date.parse(latest.updated_at) < refreshStaleAfterMs;
            if (latestIsHealthy) {
              core.info(`Latest market refresh succeeded ${Math.round((now - Date.parse(latest.updated_at)) / 60000)} minute(s) ago.`);
              return;
            }

            const recentRecovery = refreshRuns.find(run =>
              run.event === "workflow_dispatch" &&
              now - Date.parse(run.created_at) < dispatchCooldownMs
            );
            if (recentRecovery) {
              core.info(`Market refresh recovery cooldown active (run ${recentRecovery.id}).`);
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "live-candle-refresh.yml",
              ref: "main"
            });
            core.notice("Dispatched a recovery market refresh on main.");
            core.summary
              .addHeading("Market refresh recovery")
              .addList([
                latest
                  ? `Latest refresh: ${latest.status}/${latest.conclusion ?? "no conclusion"} at ${latest.updated_at}.`
                  : "No prior market refresh run was found.",
                "No active refresh was running.",
                "One recovery refresh was dispatched on main.",
                "A 10-minute cooldown prevents duplicate recovery dispatches."
              ])
              .write();
