name: Gold XAUUSD Daily Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "market-indicators.test.js"
      - ".github/workflows/gold-daily.yml"

concurrency:
  group: gold-daily-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gold-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Syntax checks
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Download Gold candles
        run: MARKET_FILTER=XAUUSD npm run download
        env:
          DATA_DAYS_BACK: "180"
      - name: Generate XAUUSD report
        run: |
          set -o pipefail
          MARKET_FILTER=XAUUSD SIGNAL_PROFILE=gold npm start 2>&1 | tee gold-signals.txt
        env:
          AGENT_TRAINING_CUTOFF: ${{ vars.AGENT_TRAINING_CUTOFF }}
      - name: Upload Gold signal report immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-daily-signals
          path: gold-signals.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Backtest strategy profiles
        run: |
          set -o pipefail
          MARKET=XAUUSD npm run backtest | tee gold-backtests.txt
          MARKET=XAUUSD SIGNAL_PROFILE=strict npm run backtest | tee -a gold-backtests.txt
          MARKET=XAUUSD SIGNAL_PROFILE=advanced npm run backtest | tee -a gold-backtests.txt
          MARKET=XAUUSD SIGNAL_PROFILE=institutional npm run backtest | tee -a gold-backtests.txt
          npm run backtest:gold | tee -a gold-backtests.txt
      - name: Chronological holdout validation
        run: |
          set -o pipefail
          BACKTEST_START_RATIO=0.7 MARKET=XAUUSD npm run backtest | tee -a gold-backtests.txt
          BACKTEST_START_RATIO=0.7 MARKET=XAUUSD SIGNAL_PROFILE=advanced npm run backtest | tee -a gold-backtests.txt
          BACKTEST_START_RATIO=0.7 MARKET=XAUUSD SIGNAL_PROFILE=institutional npm run backtest | tee -a gold-backtests.txt
          npm run backtest:gold:holdout | tee -a gold-backtests.txt
      - name: Upload Gold validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-daily-validation
          path: |
            gold-signals.txt
            gold-backtests.txt
          if-no-files-found: warn
          retention-days: 30
