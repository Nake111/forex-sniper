name: Auto-merge verified signal candidate PR

on:
  workflow_run:
    workflows:
      - Main Branch Code and Test Check
      - Signal Engine Regression Tests
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  merge-verified-pr:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'feature/immediate-directional-candidates'
    runs-on: ubuntu-latest
    steps:
      - name: Merge only after both required checks pass on the exact commit
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.workflow_run.head_sha;
            const expected = [
              { id: 407325151, name: 'Main Branch Code and Test Check' },
              { id: 414801327, name: 'Signal Engine Regression Tests' }
            ];

            const prs = await github.rest.pulls.list({
              owner, repo, state: 'open', head: owner + ':feature/immediate-directional-candidates'
            });
            const pr = prs.data.find(item => item.base.ref === 'main' && item.head.sha === sha && !item.draft);
            if (!pr) {
              core.info('No matching open PR at this exact commit; nothing to merge.');
              return;
            }

            for (const check of expected) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: check.id, head_sha: sha, per_page: 20
              });
              const run = runs.data.workflow_runs.find(item => item.event === 'pull_request');
              if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
                core.info(check.name + ' has not passed for ' + sha + '; keeping PR open.');
                return;
              }
            }

            const latest = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
            if (latest.data.head.sha !== sha || latest.data.state !== 'open') {
              core.info('PR changed while checks were being verified; keeping it open.');
              return;
            }

            const result = await github.rest.pulls.merge({
              owner, repo, pull_number: pr.number, merge_method: 'squash',
              sha, commit_title: 'Show scored directional candidates before final approval'
            });
            if (!result.data.merged) throw new Error('GitHub did not confirm the merge.');
            core.info('Merged PR #' + pr.number + ' after both required workflows passed on ' + sha + '.');
