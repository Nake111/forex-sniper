name: BTC Sniper Check

on:
  push:
    branches: [Btcusd]
  pull_request:
    branches: [Btcusd]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript
        run: npm run check

      - name: Run signal and trade-plan tests
        run: npm test

      - name: Download 180 days of BTC/USD data
        run: npm run download

      - name: Run BTC Sniper analysis without replacing full history
        run: npm run analyze

      - name: Run BTC/USD historical backtest
        run: npm run backtest

      - name: Run Donchian research backtest
        run: npm run backtest:donchian

      - name: Preserve market data and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusd-validation-data
          path: |
            data/btcusd-m5.json
            data/btcusd-m15.json
            data/btcusd-h1.json
          if-no-files-found: warn
          retention-days: 30
