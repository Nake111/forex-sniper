
name: BTC Sniper Check

on:
  push:
    branches: [BTCUSD]
  pull_request:
    branches: [BTCUSD]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript
        run: npm run check

      - name: Test trade-plan safety
        run: npm test

      - name: Download BTC/USD data
        run: npm run download

      - name: Run BTC Sniper analysis
        run: npm start

      - name: Run BTC/USD historical backtest
        run: npm run backtest
