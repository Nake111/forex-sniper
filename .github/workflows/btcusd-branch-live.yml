name: BTCUSD Branch Live Refresh

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btcusd-branch-live-refresh
  cancel-in-progress: false

jobs:
  refresh-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout BTCUSD branch
        uses: actions/checkout@v4
        with:
          ref: Btcusd
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Validate code and signal tests
        run: npm run check && npm test

      - name: Refresh closed BTCUSD proxy candles
        run: npm run sync:market

      - name: Analyze BTCUSD M5, M15 and H1
        run: npm run analyze
        env:
          MARKET_DATA_SOURCE: binance

      - name: Persist candles, market snapshot and signal to Btcusd
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/online-btcusdt-m5.json data/online-btcusdt-m15.json data/online-btcusdt-h1.json data/online-market.json data/latest-signal.json
          if git diff --cached --quiet; then
            echo "No candle or signal changes to commit."
          else
            git commit -m "Refresh BTCUSD branch candles and signal"
            git push origin HEAD:Btcusd
          fi

      - name: Upload analysis snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusd-live-analysis
          path: |
            data/latest-signal.json
            data/online-market.json
          if-no-files-found: warn
          retention-days: 7
