name: Forex Sniper Automatic Signals

on:
  # Manual diagnostic only; the live-candle-refresh workflow owns the automatic cadence.
  workflow_dispatch:

concurrency:
  group: forex-sniper-market-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BTC_DATA_PREFIX: kraken-btcusd
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare candle cache directory
        run: mkdir -p data

      - name: Restore candle history cache
        uses: actions/cache@v4
        with:
          path: data/*.json
          key: forex-sniper-candles-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            forex-sniper-candles-${{ runner.os }}-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Check syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Incrementally refresh market candles
        run: npm run download
        env:
          DATA_DAYS_BACK: "30"
          DATA_OVERLAP_DAYS: "3"
          DOWNLOAD_CONCURRENCY: "3"
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          DUKASCOPY_BATCH_SIZE: "10"
          DUKASCOPY_BATCH_PAUSE_MS: "100"
          DUKASCOPY_REQUEST_INTERVAL_MS: "100"
          DUKASCOPY_RETRY_COUNT: "2"
          DUKASCOPY_RATE_LIMIT_RETRIES: "3"

      - name: Generate EUR/USD, BTC/USD and XAU/USD signals
        run: |
          set -o pipefail
          {
            echo "FOREX SNIPER AUTOMATIC SIGNAL REPORT"
            echo "Generated UTC: $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo "Schedule target: every 5 minutes (GitHub Actions; actual start can be delayed)"
            npm start
          } 2>&1 | tee signals.txt
        env:
          AGENT_TRAINING_CUTOFF: ${{ vars.AGENT_TRAINING_CUTOFF }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          LLM_TIMEOUT_MS: "8000"

      - name: Upload latest signal report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forex-sniper-auto-signals
          path: signals.txt
          if-no-files-found: warn
          retention-days: 14
