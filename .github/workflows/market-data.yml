name: Scheduled Multi-Market Snapshot

on:
  # Manual diagnostic only; automatic refresh and publication run in live-candle-refresh.yml.
  workflow_dispatch:

concurrency:
  group: forex-sniper-market-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BTC_DATA_PREFIX: kraken-btcusd
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Prepare candle cache directory
        run: mkdir -p data

      - name: Restore candle history cache
        uses: actions/cache@v4
        with:
          path: data/*.json
          key: forex-sniper-candles-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            forex-sniper-candles-${{ runner.os }}-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Validate code and strategy tests
        run: npm run check && npm test

      - name: Incrementally refresh EUR/USD, BTC/USD and XAU/USD candles
        run: npm run download
        env:
          DATA_DAYS_BACK: "30"
          DATA_OVERLAP_DAYS: "3"
          DOWNLOAD_CONCURRENCY: "3"
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

      - name: Generate multi-market signal report
        run: set -o pipefail; npm start 2>&1 | tee market-snapshot.txt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          LLM_TIMEOUT_MS: "2000"

      - name: Require fresh quotes and complete three-agent verification
        run: npm run verify:snapshot

      - name: Upload multi-market snapshot and candles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-market-snapshot
          path: |
            market-snapshot.txt
            data/*.json
          if-no-files-found: warn
          retention-days: 14
