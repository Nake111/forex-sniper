name: BTC Scheduled Market Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/market-data.yml"

concurrency:
  group: btc-market-snapshot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Validate code and strategy tests
        run: npm run check && npm test

      - name: Download BTC/USD candles
        run: MARKET_FILTER=BTCUSD npm run download
        env:
          DATA_DAYS_BACK: "30"
          DOWNLOAD_CONCURRENCY: "3"

      - name: Generate BTC/USD snapshot report
        run: MARKET_FILTER=BTCUSD npm start 2>&1 | tee btc-snapshot.txt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          LLM_TIMEOUT_MS: "8000"

      - name: Upload BTC snapshot and candles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-market-snapshot
          path: |
            btc-snapshot.txt
            data/btcusd-*.json
          if-no-files-found: warn
          retention-days: 14
