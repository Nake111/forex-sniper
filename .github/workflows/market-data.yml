name: BTC 24-7 Online Market Data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/market-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-online-market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - name: Checkout BTC signal branch
        uses: actions/checkout@v4
        with:
          ref: Btcusd
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate code and strategy tests
        run: npm run check && npm test

      - name: Fetch public exchange market data
        run: npm run sync:market

      - name: Run BTC signal analysis using online candles
        run: npm run analyze
        env:
          MARKET_DATA_SOURCE: binance

      - name: Commit rolling market data and latest signal to Btcusd
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/online-btcusdt-m5.json data/online-btcusdt-m15.json data/online-btcusdt-h1.json data/online-market.json data/latest-signal.json
          if git diff --cached --quiet; then
            echo "No market-data changes to commit."
          else
            git commit -m "Update 24-7 BTC online market data"
            git push origin HEAD:Btcusd
          fi
