name: Freeze Approved Training Cutoff

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/calculate-training-cutoff.yml"
      - "config/approved-training-cutoff.json"

permissions:
  contents: read
  actions: write

concurrency:
  group: forex-sniper-training-cutoff-freeze
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout approved cutoff record
        uses: actions/checkout@v4

      - name: Validate artifact evidence and freeze repository variable
        id: freeze
        uses: actions/github-script@v7
        env:
          TRAINING_CUTOFF_ADMIN_TOKEN: ${{ secrets.TRAINING_CUTOFF_ADMIN_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const sourcePath = 'config/approved-training-cutoff.json';
            const report = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
            const cutoffMs = Date.parse(report.trainingCutoff || '');
            const holdoutMs = Date.parse(report.holdoutStartsAt || '');
            const total = Number(report.totalUniqueTimestamps);
            const training = Number(report.trainingCandleCount);
            const expectedCutoff = '2026-09-21T07:25:00.000Z';

            if (report.schemaVersion !== 1 || report.status !== 'APPROVED_TO_FREEZE') {
              throw new Error('Approved cutoff record has an unexpected schema or status.');
            }
            if (report.trainingCutoff !== expectedCutoff ||
                !Number.isFinite(cutoffMs) || !Number.isFinite(holdoutMs) ||
                holdoutMs - cutoffMs !== 5 * 60 * 1000) {
              throw new Error('Cutoff does not match the previously verified approved boundary.');
            }
            if (report.holdoutRead !== false) {
              throw new Error('Refusing to freeze: holdoutRead must remain false.');
            }
            if (!Number.isInteger(total) || total !== 51401 ||
                !Number.isInteger(training) || training !== Math.floor(total * 0.7)) {
              throw new Error('Chronological 70/30 boundary does not match the verified calculation.');
            }
            const artifact = report.sourceArtifact;
            if (artifact?.workflowRunId !== 43697661964 ||
                artifact?.artifactId !== 14154733625 ||
                artifact?.artifactName !== 'verified-training-cutoff' ||
                artifact?.artifactSha256 !== 'a6ca279c94f464abbc2a0ddcd63fa48a0c4252ec6ee529ff7f6bd855f19f778d') {
              throw new Error('Source training-cutoff artifact identity or digest does not match the inspected artifact.');
            }
            const datasets = report.datasets;
            const expectedMarkets = ['EURUSD', 'BTCUSD', 'XAUUSD'];
            if (!Array.isArray(datasets) || datasets.length !== 3 ||
                !expectedMarkets.every(m => datasets.some(d => d.market === m))) {
              throw new Error('All three market datasets are required.');
            }
            for (const d of datasets) {
              if (!/^[a-f0-9]{64}$/i.test(d.sha256 || '') ||
                  !Number.isInteger(d.candlesInCommonWindow) ||
                  !Number.isInteger(d.trainingCandles) ||
                  !Number.isInteger(d.holdoutCandles) ||
                  d.trainingCandles + d.holdoutCandles !== d.candlesInCommonWindow ||
                  d.trainingSharePct < 65 || d.trainingSharePct > 75) {
                throw new Error('Dataset integrity or per-market 70/30 coverage failed for ' + d.market);
              }
            }

            const name = 'AGENT_TRAINING_CUTOFF';
            const value = new Date(cutoffMs).toISOString();
            const token = process.env.TRAINING_CUTOFF_ADMIN_TOKEN;
            if (token) {
              const admin = github.getOctokit(token);
              const { owner, repo } = context.repo;
              let exists = true;
              try {
                await admin.rest.actions.getRepoVariable({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                exists = false;
              }
              if (exists) await admin.rest.actions.updateRepoVariable({ owner, repo, name, value });
              else await admin.rest.actions.createRepoVariable({ owner, repo, name, value });
              const verified = await admin.rest.actions.getRepoVariable({ owner, repo, name });
              if (verified.data.value !== value) throw new Error('Repository variable read-back did not match the approved cutoff.');
              report.status = 'FROZEN';
              report.variableVerified = true;
              report.frozenAt = new Date().toISOString();
              core.notice(name + ' frozen and verified: ' + value);
            } else {
              report.status = 'VERIFIED_AWAITING_REPOSITORY_VARIABLE';
              report.variableVerified = false;
              report.requiredManualSetting = 'Repository Settings → Secrets and variables → Actions → Variables → AGENT_TRAINING_CUTOFF';
              core.warning('Artifact verified, but GitHub integration cannot write repository variables. Configure AGENT_TRAINING_CUTOFF manually or add TRAINING_CUTOFF_ADMIN_TOKEN with Actions variables read/write access.');
            }
            report.variableName = name;
            report.holdoutRead = false;
            fs.mkdirSync('reports', { recursive: true });
            fs.writeFileSync('reports/frozen-training-cutoff.json', JSON.stringify(report, null, 2) + '\n');
            core.setOutput('cutoff', value);

      - name: Upload frozen cutoff verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: frozen-training-cutoff
          path: reports/frozen-training-cutoff.json
          if-no-files-found: error
          retention-days: 90
