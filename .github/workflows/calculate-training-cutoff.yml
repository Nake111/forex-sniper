name: Calculate and Freeze Training Cutoff

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/calculate-training-cutoff.yml"
      - "scripts/calculate-training-cutoff.js"

permissions:
  contents: read
  actions: write

jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATA_DAYS_BACK: "180"
      DATA_OVERLAP_DAYS: "3"
      DOWNLOAD_CONCURRENCY: "6"
      BTC_DATA_PREFIX: "btcusd"
      DUKASCOPY_BATCH_SIZE: "8"
      DUKASCOPY_BATCH_PAUSE_MS: "150"
      DUKASCOPY_REQUEST_INTERVAL_MS: "120"
      DUKASCOPY_RETRY_COUNT: "3"
      DUKASCOPY_RATE_LIMIT_RETRIES: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download full chronological research history
        run: npm run download

      - name: Calculate chronological 70/30 boundary without reading holdout outcomes
        run: node scripts/calculate-training-cutoff.js

      - name: Validate and configure the frozen cutoff repository variable
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = 'reports/training-cutoff.json';
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const cutoffMs = Date.parse(report.trainingCutoff || '');
            const holdoutMs = Date.parse(report.holdoutStartsAt || '');
            const total = Number(report.totalUniqueTimestamps);
            const training = Number(report.trainingCandleCount);
            const datasets = report.datasets;

            if (report.status !== 'CALCULATED_NOT_YET_FROZEN') {
              throw new Error('Cutoff report is not in the expected pre-freeze state.');
            }
            if (report.holdoutRead !== false) {
              throw new Error('Refusing to freeze: report does not prove holdoutRead=false.');
            }
            if (!Number.isFinite(cutoffMs) || !Number.isFinite(holdoutMs) || holdoutMs <= cutoffMs) {
              throw new Error('Training cutoff or holdout start is invalid.');
            }
            if (!Number.isInteger(total) || total < 1000 ||
                !Number.isInteger(training) || training !== Math.floor(total * 0.7)) {
              throw new Error('Chronological split is not exactly floor(70% of common timestamps).');
            }
            if (!Array.isArray(datasets) || datasets.length !== 3 ||
                !['EURUSD', 'BTCUSD', 'XAUUSD'].every(m => datasets.some(d => d.market === m))) {
              throw new Error('All three market datasets are required.');
            }
            for (const dataset of datasets) {
              if (!/^[a-f0-9]{64}$/i.test(dataset.sha256 || '') ||
                  !Number.isInteger(dataset.trainingCandles) ||
                  !Number.isInteger(dataset.holdoutCandles) ||
                  dataset.trainingCandles < 1 || dataset.holdoutCandles < 1 ||
                  dataset.trainingCandles + dataset.holdoutCandles !== dataset.candlesInCommonWindow ||
                  dataset.trainingSharePct < 65 || dataset.trainingSharePct > 75) {
                throw new Error('Dataset integrity or 70/30 coverage validation failed for ' + dataset.market);
              }
            }

            const name = 'AGENT_TRAINING_CUTOFF';
            const value = new Date(cutoffMs).toISOString();
            const { owner, repo } = context.repo;
            let exists = true;
            try {
              await github.rest.actions.getRepoVariable({ owner, repo, name });
            } catch (error) {
              if (error.status !== 404) throw error;
              exists = false;
            }
            if (exists) {
              await github.rest.actions.updateRepoVariable({ owner, repo, name, value });
            } else {
              await github.rest.actions.createRepoVariable({ owner, repo, name, value });
            }

            const verified = await github.rest.actions.getRepoVariable({ owner, repo, name });
            if (verified.data.value !== value) {
              throw new Error('Repository variable read-back does not match the calculated cutoff.');
            }

            report.status = 'FROZEN';
            report.variableName = name;
            report.variableVerified = true;
            report.frozenAt = new Date().toISOString();
            report.holdoutRead = false;
            fs.writeFileSync(file, JSON.stringify(report, null, 2) + '\n');
            core.notice(name + ' frozen and verified: ' + value);
      
      - name: Publish verified frozen cutoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-training-cutoff
          path: reports/training-cutoff.json
          if-no-files-found: error
          retention-days: 90
